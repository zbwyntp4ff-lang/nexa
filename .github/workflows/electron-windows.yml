name: Windows Electron release validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/electron/**"
      - "frontend/build/**"
      - "frontend/scripts/electron-build.js"
      - "frontend/next.config.ts"
      - "frontend/src/**"
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/electron-windows.yml"

permissions:
  contents: read

concurrency:
  group: electron-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install backend runtime into the Windows bundle
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Windows installer and portable app
        working-directory: frontend
        run: npm run dist:electron:win
      - name: Verify packaged files and Python runtime
        shell: pwsh
        run: |
          $app = Join-Path $PWD "frontend/dist-electron/win-unpacked/NEXA.exe"
          $python = Join-Path $PWD "frontend/dist-electron/win-unpacked/resources/backend/.venv/Scripts/python.exe"
          if (!(Test-Path $app)) { throw "Unpacked NEXA executable is missing: $app" }
          if (!(Test-Path $python)) { throw "Bundled Python runtime is missing: $python" }
          $installer = Get-ChildItem "frontend/dist-electron" -Filter "*Setup*.exe" | Select-Object -First 1
          if (!$installer) { throw "NSIS installer was not produced." }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Executable: $app"
          Write-Host "Bundled Python: $python"
      - name: Install and launch packaged application
        shell: pwsh
        run: |
          $installer = Get-ChildItem "frontend/dist-electron" -Filter "*Setup*.exe" | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP "NEXA-installed"
          Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait
          $app = Join-Path $installDir "NEXA.exe"
          if (!(Test-Path $app)) { throw "Installed NEXA executable is missing." }
          $env:NEXA_LOCAL_DESKTOP = "1"
          $proc = Start-Process -FilePath $app -PassThru
          $healthy = $false
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:8420/health" -TimeoutSec 2
              if ($response) { $healthy = $true; break }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (!$healthy) {
            taskkill /PID $proc.Id /T /F 2>$null
            throw "Packaged NEXA backend did not become healthy within 60 seconds."
          }
          Write-Host "Packaged NEXA backend health check passed."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
      - name: Upload Windows installers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexa-windows-installers
          path: frontend/dist-electron/*.exe
          if-no-files-found: warn
          retention-days: 7
