name: Preview shadcn CSS eject (no repository writes)

on:
  push:
    branches:
      - security/rebased-main-2026-11-17
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/preview-shadcn-eject.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install current lockfile
        run: npm ci
      - name: Inline shadcn CSS and remove CLI dependency
        run: npx shadcn eject --yes
      - name: Regenerate lockfile and verify clean install
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
      - name: Frontend unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Write npm audit report
        if: always()
        run: npm audit --json > npm-audit.json || true
      - name: Upload proposed changes and audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadcn-eject-preview
          path: |
            frontend/package.json
            frontend/package-lock.json
            frontend/src/app/globals.css
            frontend/npm-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce npm security gate
        run: npm audit --audit-level=high
