name: Remediate npm security advisories

on:
  push:
    branches:
      - fix/security-and-reliability-non-billing
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/remediate-npm.yml"

permissions:
  contents: write

concurrency:
  group: npm-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Upgrade directly vulnerable packages
        working-directory: frontend
        run: |
          npm pkg set dependencies.next="16.4.6"
          npm pkg set devDependencies.eslint-config-next="16.4.6"
          npm pkg set devDependencies.electron="^41.7.1"
          npm pkg set devDependencies.electron-builder="^26.18.0"

      - name: Regenerate lockfile and apply compatible fixes
        working-directory: frontend
        run: |
          npm install --global npm@latest
          npm install --no-audit --no-fund
          npm update --no-audit --no-fund
          npm dedupe --no-audit --no-fund

      - name: Require a clean npm dependency audit
        working-directory: frontend
        run: npm audit

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit verified dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): remediate npm security advisories"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "No dependency changes to commit."
          fi
