name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pip-audit
      - name: Report Python dependency advisories
        run: |
          pip-audit -r requirements.txt --format=json > pip-audit.json || true
          python -c "import json; d=json.load(open('pip-audit.json')); rows=[(p['name'],p['version'],v['id'],','.join(v.get('fix_versions',[]))) for p in d.get('dependencies',[]) for v in p.get('vulns',[])]; print('Python advisories:', len(rows)); [print(*row, sep=' | ') for row in rows]"
      - name: Upload Python audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexa-python-audit-report
          path: pip-audit.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Unit / security / planner / office / compound / phase5
        env:
          AI_PROVIDER: mock
          TOKENS_ENFORCE: "false"
          NEXA_LOCAL_DESKTOP: "1"
        run: |
          python -m pytest \
            tests/test_phase5_reliability.py \
            tests/test_phase6_beta.py \
            tests/test_security_phase6_final.py \
            tests/test_beta_release_gate.py \
            tests/test_open_beta_readiness.py \
            tests/test_desktop_phase4.py \
            tests/test_compound_projects.py \
            tests/test_office_tools.py \
            tests/test_agent_planner.py \
            tests/test_agent.py \
            tests/test_knowledge_quality.py \
            tests/test_knowledge_rag.py \
            tests/test_security_part15.py \
            tests/test_cloud_isolation.py \
            tests/test_attachments.py \
            tests/test_auth.py \
            tests/test_model_router.py \
            tests/test_learning_memory.py \
            tests/test_video_intent.py \
            tests/test_plugins.py \
            tests/test_security_audit_regressions.py \
            tests/test_page_fetcher_pinning.py \
            tests/test_api.py \
            tests/test_browser_verify.py \
            -q --tb=short -m "not network"
      - name: Write offline eval reports
        env:
          AI_PROVIDER: mock
        run: |
          python -c "from app.knowledge.eval_rag import write_rag_eval_report; print(write_rag_eval_report())"
          python -c "from app.learning.eval_suite import write_eval_report; print(write_eval_report())"

  electron-ipc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Report npm dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,direct:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,advisories:(v.via||[]).filter(x=>typeof x==='object').map(x=>x.title)}))"
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexa-npm-audit-report
          path: frontend/npm-audit.json
          if-no-files-found: ignore
          retention-days: 7
      - run: npx vitest run electron/__tests__/packaging.test.js

  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Block high and critical npm advisories
        run: npm audit --audit-level=high
      - name: Frontend unit tests
        run: npm test
      - name: Frontend production build
        run: npm run build
