name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# CI executes pull-request code; its token must never be able to write repository contents.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pip-audit
      - name: Report Python dependency advisories
        run: |
          pip-audit -r requirements.txt --format=json > pip-audit.json
          python -c "import json; d=json.load(open('pip-audit.json')); rows=[(p['name'],p['version'],v['id'],','.join(v.get('fix_versions',[]))) for p in d.get('dependencies',[]) for v in p.get('vulns',[])]; print('Python advisories:', len(rows)); [print(*row, sep=' | ') for row in rows]"
      - name: Upload Python audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexa-python-audit-report
          path: pip-audit.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Full backend regression suite
        env:
          AI_PROVIDER: mock
          TOKENS_ENFORCE: "false"
          NEXA_LOCAL_DESKTOP: "1"
        run: python -m pytest tests -q --tb=short -m "not network"
      - name: Write offline eval reports
        env:
          AI_PROVIDER: mock
        run: |
          python -c "from app.knowledge.eval_rag import write_rag_eval_report; print(write_rag_eval_report())"
          python -c "from app.learning.eval_suite import write_eval_report; print(write_eval_report())"

  electron-ipc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - name: Report npm dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,direct:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,advisories:(v.via||[]).filter(x=>typeof x==='object').map(x=>x.title)}))"
          node -e "const a=require('./npm-audit-production.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log('PRODUCTION '+JSON.stringify({name,severity:v.severity,direct:v.isDirect,range:v.range,advisories:(v.via||[]).filter(x=>typeof x==='object').map(x=>x.title)}))"
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexa-npm-audit-report
          path: |
            frontend/npm-audit.json
            frontend/npm-audit-production.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce full npm dependency audit
        run: npm audit
      - run: npx vitest run electron/__tests__

  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Frontend unit tests
        run: npm test
      - name: Frontend production build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev
  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser end-to-end tests
        env:
          CI: "true"
        run: npm run e2e
