# EXAMPLE ONLY — open-beta STAGING blueprint (NOT free smoke, NOT production DNS).
# Copy/adapt into Render Dashboard / Blueprint AFTER the owner approves:
#   - a plan that allows a persistent disk (Render Free has none — incompatible
#     with NEXA_PUBLIC_BETA=true / NEXA_STORAGE_MODE=persistent), and
#   - SMTP + a named AI provider key.
#
# Do NOT put secrets in this file. Do NOT deploy until explicitly approved.
# Do NOT point the public beta custom domain here without separate permission.
#
# Incompatible with root render.yaml (free/ephemeral/mock/skip-email).

services:
  - type: web
    name: nexa-staging
    runtime: docker
    # plan: starter   # or current paid tier that supports disks — verify pricing
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Uncomment when creating a service with persistent disk:
    # disk:
    #   name: nexa-staging-data
    #   mountPath: /app/data
    #   sizeGB: 1
    envVars:
      - key: NEXA_PUBLIC_BETA
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: NEXA_STORAGE_MODE
        value: persistent
      - key: LOG_LEVEL
        value: INFO
      - key: MEMORY_BACKEND
        value: sql
      - key: DATABASE_URL
        value: sqlite:///data/nexa-staging.db
      - key: TOKENS_ENFORCE
        value: "true"
      - key: AUTH_SINGLE_USER
        value: "false"
      - key: AUTH_SKIP_EMAIL_VERIFICATION
        value: "false"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: AUTH_BOOTSTRAP_FIRST_OWNER
        value: "false"
      - key: EMAIL_PROVIDER
        value: smtp
      - key: WORKFLOWS_ENABLED
        value: "false"
      - key: ALLOW_MODEL_FALLBACK
        value: "false"
      - key: NEXA_AI_KILL_SWITCH
        value: "false"
      - key: AGENT_MAX_PARALLEL_PER_USER
        value: "2"
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: REGISTER_RATE_LIMIT_PER_HOUR
        value: "20"
      - key: FREE_TIER_MODE
        value: "false"
      - key: IMAGE_PROVIDER
        value: none
      - key: VIDEO_PROVIDER
        value: none
      - key: WEB_SEARCH_PROVIDER
        value: duckduckgo
      - key: REQUEST_TIMEOUT_SECONDS
        value: "90"
      # Named model only — mock and openrouter/free are refused at startup.
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_API_KEY
        sync: false
      # Or switch AI_PROVIDER=openai + OPENAI_API_KEY in Dashboard.
      - key: OPENAI_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: AUTH_OWNER_EMAILS
        sync: false
      # Set AFTER first deploy to https://<service>.onrender.com (no trailing slash):
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_PUBLIC_BASE_URL
        sync: false
      - key: BILLING_PUBLIC_BASE_URL
        sync: false
      # MUST stay unset on staging cloud:
      # NEXA_LOCAL_DESKTOP / NEXA_ELECTRON_ALLOW_LAN_BIND / NEXA_ALLOW_PACKAGED_DEVTOOLS
